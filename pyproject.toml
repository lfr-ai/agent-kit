[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "agent-kit"
version = "0.1.0"
description = "Small, policy-checked APM capability bundles and verification tools."
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Agent Kit contributors" }]
dependencies = ["PyYAML>=6.0.2,<7"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
agent-kit = "agent_kit.main:main"

[dependency-groups]
# Development tooling never ships to consumers, so every tool is pinned exactly.
# Dependabot updates these pins together with uv.lock.
dev = [
  "apm-cli==0.33.0",
  "commitizen==4.19.2",
  "hypothesis==6.169.0",
  "import-linter==2.15",
  "pre-commit==4.6.2",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-xdist==3.8.0",
  "ruff==0.17.1",
  "tox==4.67.1",
  "tox-uv-bare==1.37.0",
  "ty==0.0.86",
]
# Installed alone by bootstrap so the full lock is audited before it is synced.
audit = ["pip-audit==2.10.1"]

[tool.uv]
required-version = ">=0.10.0,<0.14"
default-groups = ["dev", "audit"]
# Pin the isolated build backend closure; uv.lock covers only runtime and
# development dependencies. Add hashes when the minimum uv supports them.
build-constraint-dependencies = [
  "hatchling==1.32.4",
  "packaging==26.3",
  "pathspec==1.1.1",
  "pluggy==1.6.0",
  "trove-classifiers==2026.9.21.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_kit"]
