[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "agent-kit"
version = "0.1.0"
description = "APM-first capability sources and repository validation library."
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Agent Kit contributors" }]
dependencies = ["PyYAML>=6.0.2,<7"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]

[dependency-groups]
# Development tools never ship. Dependabot updates their exact pins with
# uv.lock.
dev = [
  "apm-cli==0.35.0",
  "commitizen==4.19.3",
  "copier==9.19.1",
  "filelock==4.2.9",
  "go-task-bin==3.54.0",
  "httpx==0.28.1",
  "hypothesis==6.170.15",
  "import-linter==2.16",
  "litellm==1.108.3",
  "platform-kit-runtime[ai,auth,database,ocr,ratelimit,retrieval,telemetry]==0.1.0",
  "pre-commit==4.7.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-timeout==2.4.0",
  "pytest-xdist==3.8.0",
  "ruff==0.17.4",
  "tox==4.67.13",
  "tox-uv-bare==1.37.7",
  "ty==0.0.99",
]

[tool.uv]
# The audit gate needs JSON reports and the `audit-command` preview feature name.
required-version = ">=0.12.0,<0.14"
default-groups = ["dev"]
# Pins the isolated build backend closure, which uv.lock does not cover.
build-constraint-dependencies = [
  "hatchling==1.27.0",
  "packaging==26.3",
  "pathspec==1.1.1",
  "pluggy==1.6.0",
  "trove-classifiers==2026.9.21.13",
]

[tool.uv.workspace]
members = ["packages/runtime"]

[tool.uv.sources]
platform-kit-runtime = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/agent_kit"]
