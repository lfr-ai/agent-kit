src = ["src", "tests", "scripts", ".agents/guard"]
extend-exclude = [
  "build",
  "dist",
  "apm_modules",
  # APM-deployed and attested native projections are generated, never edited.
  ".agents/skills",
  ".claude",
  ".github",
]

[format]
line-ending = "lf"
docstring-code-format = true

[lint]
# Ruff's default rule set (E4, E7, E9, F) plus: docs.astral.sh/ruff/rules
extend-select = [
  "W",     # pycodestyle warnings
  "I",     # isort
  "N",     # pep8-naming
  "D",     # pydocstyle
  "UP",    # pyupgrade
  "ANN",   # flake8-annotations
  "B",     # flake8-bugbear
  "S",     # flake8-bandit
  "FBT",   # flake8-boolean-trap
  "A",     # flake8-builtins
  "C4",    # flake8-comprehensions
  "C90",   # mccabe
  "DTZ",   # flake8-datetimez
  "ISC",   # flake8-implicit-str-concat
  "INP",   # flake8-no-pep420
  "LOG",   # flake8-logging
  "G",     # flake8-logging-format
  "PIE",   # flake8-pie
  "PT",    # flake8-pytest-style
  "PTH",   # flake8-use-pathlib
  "PGH",   # pygrep-hooks
  "PL",    # Pylint
  "PERF",  # Perflint
  "RSE",   # flake8-raise
  "RET",   # flake8-return
  "SLF",   # flake8-self
  "SIM",   # flake8-simplify
  "SLOT",  # flake8-slots
  "T20",   # flake8-print
  "TD",    # flake8-todos
  "FIX",   # flake8-fixme
  "TID",   # flake8-tidy-imports
  "TRY",   # tryceratops
  "ARG",   # flake8-unused-arguments
  "ERA",   # eradicate
  "FURB",  # refurb
  "RUF",   # Ruff-specific
]
# Not selected: TC (flake8-type-checking). Moving imports under TYPE_CHECKING needs
# quoted annotations on Python 3.13, which the project forbids.
[lint.pylint]
max-args = 8

[lint.pydocstyle]
convention = "google"

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "Use concrete types or object at parsing boundaries."
"typing.cast".msg = "Narrow types rather than casting."

[lint.flake8-unused-arguments]
ignore-variadic-names = true

[lint.per-file-ignores]
"tests/**" = [
  "S101",    # assert is the pytest assertion idiom
  "D",       # test names and one-line docstrings document behavior
  "ANN401",
  "SLF001",  # tests may reach private helpers to pin internals
  "PLR2004", # literal expectations are not magic numbers
  "PLC0415", # deferred imports inside tests are deliberate
  "S105",    # fake credentials in fixtures
  "S106",
  "ARG001",  # stubs match the replaced signature
  "ARG002",
  "ARG005",
  "INP001",  # --import-mode=importlib needs no __init__.py
  "FBT001",  # parametrized/Hypothesis booleans are idiomatic in tests
  "FBT002",
  "FBT003",
]
# Command-line presentation and repository check scripts report to stdout by design.
"src/agent_kit/presentation/cli.py" = ["T201"]
"scripts/**" = ["T201"]
".agents/guard/**" = ["T201", "INP001"]
"packages/**/assets/**" = ["T201", "INP001", "C901", "PLR0912"]
