# Step template: install a Bun release verified against SHA-256 (Linux x64 baseline).
parameters:
  - name: bunVersion
    type: string
  - name: bunSha256
    type: string
  - name: lockfile
    type: string
    default: bun.lock

steps:
  - task: Cache@2
    displayName: Cache Bun package downloads
    inputs:
      key: '"bun" | "$(Agent.OS)" | "${{ parameters.bunVersion }}" | ${{ parameters.lockfile }}'
      restoreKeys: |
        "bun" | "$(Agent.OS)" | "${{ parameters.bunVersion }}"
      path: $(Pipeline.Workspace)/.bun/install

  - bash: |
      set -euo pipefail
      fail() { echo "##vso[task.logissue type=error]$1"; exit 1; }
      [[ "${BUN_SHA256}" =~ ^[0-9a-f]{64}$ ]] ||
        fail "bunSha256 must be a lowercase SHA-256 hex digest"
      bin_dir="${BUN_INSTALL}/bin"
      # Keep the verified archive, not the binary, so every run checks the digest.
      archive="${BUN_INSTALL}/bun-v${BUN_VERSION}-linux-x64-baseline.zip"
      mkdir -p "${bin_dir}" "${BUN_EXTRACT_DIR}"
      if [[ ! -f "${archive}" ]]; then
        curl --fail --silent --show-error --location --retry 3 \
          "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64-baseline.zip" \
          --output "${archive}"
      fi
      if ! printf '%s  %s\n' "${BUN_SHA256}" "${archive}" | sha256sum --check --status; then
        rm -f "${archive}"
        fail "Bun ${BUN_VERSION} archive does not match bunSha256"
      fi
      unzip -oq "${archive}" -d "${BUN_EXTRACT_DIR}"
      install -m 0755 "${BUN_EXTRACT_DIR}/bun-linux-x64-baseline/bun" "${bin_dir}/bun"
      echo "##vso[task.prependpath]${bin_dir}"
      echo "##vso[task.setvariable variable=BUN_INSTALL]${BUN_INSTALL}"
      "${bin_dir}/bun" --version
    displayName: Set up Bun ${{ parameters.bunVersion }}
    env:
      BUN_INSTALL: $(Pipeline.Workspace)/.bun
      BUN_EXTRACT_DIR: $(Agent.TempDirectory)/bun
      BUN_VERSION: ${{ parameters.bunVersion }}
      BUN_SHA256: ${{ parameters.bunSha256 }}
