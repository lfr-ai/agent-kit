# Install a Terraform release verified against SHA-256 (Linux amd64).
parameters:
  - name: terraformVersion
    type: string
  - name: terraformSha256
    type: string

steps:
  - bash: |
      set -euo pipefail
      fail() { echo "##vso[task.logissue type=error]$1"; exit 1; }
      [[ "${TERRAFORM_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] ||
        fail "terraformVersion must be an exact version such as 1.16.5"
      [[ "${TERRAFORM_SHA256}" =~ ^[0-9a-f]{64}$ ]] ||
        fail "terraformSha256 must be a lowercase SHA-256 hex digest"
      bin_dir="${TERRAFORM_DIR}/bin"
      archive="${TERRAFORM_DIR}/terraform.zip"
      mkdir -p "${bin_dir}"
      curl --fail --silent --show-error --location --retry 3 \
        "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
        --output "${archive}"
      printf '%s  %s\n' "${TERRAFORM_SHA256}" "${archive}" | sha256sum --check --status ||
        fail "Terraform ${TERRAFORM_VERSION} archive does not match terraformSha256"
      unzip -oq "${archive}" terraform -d "${bin_dir}"
      chmod 0755 "${bin_dir}/terraform"
      echo "##vso[task.prependpath]${bin_dir}"
      "${bin_dir}/terraform" version
    displayName: Set up Terraform ${{ parameters.terraformVersion }}
    env:
      TERRAFORM_DIR: $(Agent.TempDirectory)/terraform
      TERRAFORM_VERSION: ${{ parameters.terraformVersion }}
      TERRAFORM_SHA256: ${{ parameters.terraformSha256 }}
