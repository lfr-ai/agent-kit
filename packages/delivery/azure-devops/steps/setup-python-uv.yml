# Step template: pinned Python and uv, lock-keyed cache, then a locked sync.
# uvRequirementsFile optionally supplies hash-pinned uv; see docs/consuming.md.
parameters:
  - name: pythonVersion
    type: string
  - name: uvVersion
    type: string
  - name: uvRequirementsFile
    type: string
    default: ''
  - name: sync
    type: boolean
    default: true
  - name: workingDirectory
    type: string
    default: .

steps:
  - task: UsePythonVersion@0
    displayName: Use Python ${{ parameters.pythonVersion }}
    inputs:
      versionSpec: ${{ parameters.pythonVersion }}

  - bash: |
      set -euo pipefail
      PYTHON_VERSION="$(python -c 'import platform; print(platform.python_version())')"
      echo "##vso[task.setvariable variable=PYTHON_CACHE_VERSION]${PYTHON_VERSION}"
      echo "##vso[task.setvariable variable=UV_CACHE_DIR]${UV_CACHE_PATH}"
      pip_install=(python -m pip install --disable-pip-version-check --no-input)
      if [[ -n "${UV_REQUIREMENTS}" ]]; then
        "${pip_install[@]}" --require-hashes --no-deps --only-binary :all: --requirement "${UV_REQUIREMENTS}"
      else
        "${pip_install[@]}" --no-deps --only-binary :all: "uv==${UV_VERSION}"
      fi
      actual="$(python -m uv --version | cut -d ' ' -f 2)"
      if [[ "${actual}" != "${UV_VERSION}" ]]; then
        echo "##vso[task.logissue type=error]Installed uv ${actual} does not match uvVersion ${UV_VERSION}"
        exit 1
      fi
    displayName: Install uv ${{ parameters.uvVersion }}
    env:
      UV_VERSION: ${{ parameters.uvVersion }}
      UV_REQUIREMENTS: ${{ parameters.uvRequirementsFile }}
      UV_CACHE_PATH: $(Pipeline.Workspace)/.uv-cache

  - task: Cache@2
    displayName: Cache uv packages
    inputs:
      key: '"uv" | "$(Agent.OS)" | "$(PYTHON_CACHE_VERSION)" | ${{ parameters.workingDirectory }}/uv.lock'
      restoreKeys: |
        "uv" | "$(Agent.OS)" | "$(PYTHON_CACHE_VERSION)"
        "uv" | "$(Agent.OS)"
      path: $(Pipeline.Workspace)/.uv-cache

  - ${{ if parameters.sync }}:
      - bash: uv sync --locked
        displayName: Install locked dependencies
        workingDirectory: ${{ parameters.workingDirectory }}
