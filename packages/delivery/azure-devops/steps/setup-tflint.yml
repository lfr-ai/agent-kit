# Install a TFLint release verified against SHA-256 (Linux amd64).
parameters:
  - name: tflintVersion
    type: string
  - name: tflintSha256
    type: string

steps:
  - bash: |
      set -euo pipefail
      fail() { echo "##vso[task.logissue type=error]$1"; exit 1; }
      [[ "${TFLINT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] ||
        fail "tflintVersion must be an exact version such as 0.65.0"
      [[ "${TFLINT_SHA256}" =~ ^[0-9a-f]{64}$ ]] ||
        fail "tflintSha256 must be a lowercase SHA-256 hex digest"
      bin_dir="${TFLINT_DIR}/bin"
      archive="${TFLINT_DIR}/tflint.zip"
      mkdir -p "${bin_dir}"
      curl --fail --silent --show-error --location --retry 3 \
        "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip" \
        --output "${archive}"
      printf '%s  %s\n' "${TFLINT_SHA256}" "${archive}" | sha256sum --check --status ||
        fail "TFLint ${TFLINT_VERSION} archive does not match tflintSha256"
      unzip -oq "${archive}" tflint -d "${bin_dir}"
      chmod 0755 "${bin_dir}/tflint"
      echo "##vso[task.prependpath]${bin_dir}"
      "${bin_dir}/tflint" --version
    displayName: Set up TFLint ${{ parameters.tflintVersion }}
    env:
      TFLINT_DIR: $(Agent.TempDirectory)/tflint
      TFLINT_VERSION: ${{ parameters.tflintVersion }}
      TFLINT_SHA256: ${{ parameters.tflintSha256 }}
