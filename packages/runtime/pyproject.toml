[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "platform-kit-runtime"
version = "0.1.0"
description = "Typed FastAPI runtime foundation: health, RFC 9457 problems and middleware, with opt-in identity, AI, telemetry, database, retrieval and OCR."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Agent Kit contributors" }]
dependencies = [
    "fastapi>=0.162.0,<1",
    "opentelemetry-api>=1.45.2,<2",
    "starlette>=1.10.0,<2",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

[project.optional-dependencies]
auth = [
    "httpx>=0.28.1,<1",
    "msal>=1.39.0,<2",
    "pyjwt[crypto]>=2.15.1,<3",
    "redis>=8.1.0,<9",
]
ai = [
    "aiohttp>=3.14.4,<4",
    "azure-identity>=1.27.0,<2",
    "filelock>=4.2.1,<5",
    "litellm>=1.103.7,<1.104",
]
telemetry = [
    "opentelemetry-exporter-otlp-proto-http>=1.45.2,<2",
    "opentelemetry-sdk>=1.45.2,<2",
]
database = [
    "aiohttp>=3.14.4,<4",
    "asyncpg>=0.32.0,<0.33",
    "azure-identity>=1.27.0,<2",
    "sqlalchemy[asyncio]>=2.1.8,<3",
]
retrieval = [
    "aiohttp>=3.14.4,<4",
    "azure-identity>=1.27.0,<2",
    "azure-search-documents>=12.1.0,<13",
]
ocr = [
    "aiohttp>=3.14.4,<4",
    "azure-ai-documentintelligence>=1.0.2,<2",
    "azure-identity>=1.27.0,<2",
]
ratelimit = [
    "redis>=8.1.0,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/platform_kit_runtime"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/docs", "/LICENSE", "/pyproject.toml"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]
