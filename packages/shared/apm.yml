name: agent-kit-shared
version: "0.1.0"
license: MIT
description: Small cross-language implementation and verification practices.
targets: [copilot, claude]
includes: [.apm/hooks/, .apm/instructions/, .apm/prompts/, .apm/skills/]
dependencies:
  mcp:
    - name: context7
      registry: false
      transport: http
      url: https://mcp.context7.com/mcp/oauth
    - name: microsoft-learn
      registry: false
      transport: http
      url: https://learn.microsoft.com/api/mcp
    - name: github
      registry: false
      transport: http
      url: https://api.githubcopilot.com/mcp/
      headers:
        X-MCP-Toolsets: repos,issues,pull_requests,actions
        X-MCP-Readonly: "true"
        X-MCP-Lockdown: "true"
executables: {}
