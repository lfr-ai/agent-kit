reviews:
  profile: "assertive"
  request_changes_workflow: false
  allow_author_approval: false
  path_filters:
    # Tool-owned locks and generated projections are checked by repository gates;
    # review the canonical source instead of duplicating generated findings.
    - "!uv.lock"
    - "!bun.lock"
    - "!apm.lock.yaml"
    - "!.agents/skills/**"
    - "!.agents/agentic-setup/native-lock.json"
    - "!.claude/skills/**"
    - "!.claude/rules/**"
    - "!.claude/agents/**"
    - "!.github/agents/**"
    - "!.github/instructions/**"
  path_instructions:
    - path: "**/*.py"
      instructions: |
        Treat violations of AGENTS.md and Python instructions as blocking:
        Any or casts, magic numbers, hidden failures, boundary violations,
        suppressed complexity limits, and behavior changes without focused tests.
    - path: ".vscode/**"
      instructions: |
        Treat machine-specific paths, automatic installs, unsafe approvals,
        and MCP autostart as blocking. Require alignment with Taskfile.yml,
        root tool configuration, and docs/editor.md.
    - path: "{.github/**,.pre-commit-config.yaml,Taskfile.yml,pyproject.toml,tox.ini,package.json,.devcontainer/**,.mcp.json}"
      instructions: |
        Treat floating versions as blocking: actions must use full commit SHAs,
        hooks frozen commits, images digests, and tools exact versions. Flag new
        permissions, secrets, package runners (npx, uvx, bunx), or unlocked installs.
  tools:
    # Every other hosted tool is enabled by default and complements local gates.
    flake8:
      enabled: false # Ruff owns these Python diagnostics in ruff.toml.
    pylint:
      enabled: false # Ruff and the AST convention gate own these diagnostics.

knowledge_base:
  learnings:
    scope: "local"
