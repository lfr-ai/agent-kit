[pytest]
minversion = 9.0
testpaths = tests
pythonpath = . packages/delivery
addopts =
    --import-mode=importlib
    -ra
# Enforce config, markers, parameter IDs and xfail; pytest is exactly pinned.
strict = true
# Per-test bound so a hung subprocess fails with a stack dump instead of
# stalling the whole run; slow integration tests stay well below it.
timeout = 900
filterwarnings =
    error
markers =
    unit: In-process tests of one module or layer, no external executables.
    property: Hypothesis property-based invariants.
    integration: Cross-layer wiring and real process or filesystem boundaries.
    slow: Long-running tests excluded from the fast tier.
