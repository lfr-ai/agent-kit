[pytest]
minversion = 9.0
testpaths = tests
pythonpath = .
addopts =
    --import-mode=importlib
    -ra
# Strict config, markers, parametrization ids, and xfail; safe because pytest is pinned exactly.
strict = true
filterwarnings =
    error
markers =
    unit: In-process tests of one module or layer, no external executables.
    property: Hypothesis property-based invariants.
    integration: Cross-layer wiring and real process or filesystem boundaries.
    slow: Long-running tests excluded from the fast tier.
