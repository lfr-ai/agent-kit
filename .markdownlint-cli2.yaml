globs:
  - "**/*.md"

gitignore: true

ignores:
  - "**/node_modules/**"
  - ".venv/**"
  - ".tox/**"
  - "build/**"
  - "dist/**"
  - "apm_modules/**"
  - "htmlcov/**"
  # APM-deployed and attested native projections are generated, never edited.
  - ".agents/skills/**"
  - ".claude/**"
  - ".github/agents/**"
  - ".github/instructions/**"
  - "**/*.template.md"
  # Deployed by APM with pinned hashes; restyle only together with an APM refresh.
  - ".apm/skills/kit-capability-authoring/SKILL.md"

config:
  # Prose is soft-wrapped; skills enforce body-line budgets in catalog.json instead.
  MD013: false
  MD024:
    siblings_only: true
  MD033: false
  MD041: false
  MD046:
    style: fenced
  MD048:
    style: backtick
