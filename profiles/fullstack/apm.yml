{
  "dependencies": {
    "apm": [
      "lfr-ai/agent-kit/packages/shared#v0.1.0",
      "lfr-ai/agent-kit/packages/backend#v0.1.0",
      "lfr-ai/agent-kit/packages/frontend#v0.1.0",
      "lfr-ai/agent-kit/packages/coordination#v0.1.0"
    ],
    "mcp": [
      {
        "name": "context7",
        "registry": false,
        "transport": "http",
        "url": "https://mcp.context7.com/mcp/oauth"
      },
      {
        "name": "microsoft-learn",
        "registry": false,
        "transport": "http",
        "url": "https://learn.microsoft.com/api/mcp"
      },
      {
        "headers": {
          "X-MCP-Lockdown": "true",
          "X-MCP-Readonly": "true",
          "X-MCP-Toolsets": "repos,issues,pull_requests,actions"
        },
        "name": "github",
        "registry": false,
        "transport": "http",
        "url": "https://api.githubcopilot.com/mcp/"
      },
      {
        "name": "postman",
        "registry": false,
        "transport": "http",
        "url": "https://mcp.postman.com/minimal"
      },
      {
        "args": [
          "--bun",
          "@playwright/mcp@0.0.80",
          "--isolated",
          "--headless"
        ],
        "command": "bunx",
        "name": "playwright",
        "registry": false,
        "transport": "stdio"
      },
      {
        "args": [
          "--bun",
          "chrome-devtools-mcp@1.9.0",
          "--isolated",
          "--headless",
          "--no-usage-statistics",
          "--no-performance-crux"
        ],
        "command": "bunx",
        "name": "chrome-devtools",
        "registry": false,
        "transport": "stdio"
      },
      {
        "args": [
          "--bun",
          "shadcn@4.21.0",
          "mcp"
        ],
        "command": "bunx",
        "name": "shadcn",
        "registry": false,
        "transport": "stdio"
      },
      {
        "name": "storybook",
        "registry": false,
        "transport": "http",
        "url": "http://localhost:6006/mcp"
      }
    ]
  },
  "description": "Agent Kit fullstack profile.",
  "executables": {},
  "includes": [],
  "license": "MIT",
  "name": "agent-kit-profile-fullstack",
  "targets": [
    "copilot",
    "claude"
  ],
  "version": "0.1.0"
}
