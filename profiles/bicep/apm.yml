{
  "dependencies": {
    "apm": [
      "lfr-ai/agent-kit/packages/shared#v0.1.0",
      "lfr-ai/agent-kit/packages/iac#v0.1.0",
      "lfr-ai/agent-kit/packages/bicep#v0.1.0"
    ],
    "mcp": [
      {
        "name": "context7",
        "registry": false,
        "transport": "http",
        "url": "https://mcp.context7.com/mcp/oauth"
      },
      {
        "name": "microsoft-learn",
        "registry": false,
        "transport": "http",
        "url": "https://learn.microsoft.com/api/mcp"
      },
      {
        "headers": {
          "X-MCP-Lockdown": "true",
          "X-MCP-Readonly": "true",
          "X-MCP-Toolsets": "repos,issues,pull_requests,actions"
        },
        "name": "github",
        "registry": false,
        "transport": "http",
        "url": "https://api.githubcopilot.com/mcp/"
      },
      {
        "args": [
          "--bun",
          "@azure/mcp@2.0.5",
          "server",
          "start",
          "--read-only",
          "--namespace",
          "bicepschema",
          "--namespace",
          "get_azure_bestpractices",
          "--namespace",
          "wellarchitectedframework",
          "--namespace",
          "group",
          "--namespace",
          "policy",
          "--namespace",
          "role",
          "--namespace",
          "acr",
          "--namespace",
          "containerapps"
        ],
        "command": "bunx",
        "name": "azure",
        "registry": false,
        "transport": "stdio"
      }
    ]
  },
  "description": "Agent Kit bicep profile.",
  "executables": {},
  "includes": [],
  "license": "MIT",
  "name": "agent-kit-profile-bicep",
  "targets": [
    "copilot",
    "claude"
  ],
  "version": "0.1.0"
}
