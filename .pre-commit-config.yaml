# Freeze revisions to commit SHAs; the toolkit-static hook (verify.py pins)
# enforces this. Tool settings live in their own files.
minimum_pre_commit_version: "4.4"
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_language_version:
  python: python3.13
default_stages: [pre-commit]

repos:
  # File hygiene and syntax: the only group that may rewrite files.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        # Owned outputs are validated, but only their owning tools may rewrite them.
        exclude: &owned_outputs |
          (?x)^(
            \.agents/skills/.*|
            \.claude/(skills|rules|agents)/.*|
            \.github/(agents|instructions)/.*|
            profiles/native/.*|
            apm\.lock\.yaml|
            bun\.lock|
            uv\.lock
          )$
      - id: end-of-file-fixer
        exclude: *owned_outputs
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: *owned_outputs
      - id: fix-byte-order-marker
        exclude: *owned_outputs
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-ast
      - id: check-docstring-first
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: debug-statements
      - id: no-commit-to-branch
      - id: name-tests-test
        args: [--pytest-test-first]
        files: ^tests/.+\.py$
        # The shared delivery IaC harness is imported by test modules, not collected.
        exclude: ^tests/integration/delivery/infra/iac\.py$

  # Configuration schemas: workflows, Dependabot, Taskfile and hosted-app files.
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: a76b92851fc9eede9f9bc4073eb55202f34eb0df # frozen: 0.39.0
    hooks:
      - id: check-github-workflows
      - id: check-github-actions
        files: (^|/)action\.ya?ml$
      - id: check-dependabot
      - id: check-taskfile
      - id: check-jsonschema
        alias: check-coderabbit
        name: Validate CodeRabbit configuration
        files: ^\.coderabbit\.yaml$
        args:
          [--schemafile, "https://coderabbit.ai/integrations/schema.v2.json"]
      - id: check-jsonschema
        alias: check-codecov
        name: Validate Codecov configuration
        files: ^\.codecov\.yml$
        args: [--schemafile, "https://json.schemastore.org/codecov.json"]

  # Secrets, then prose, shell and link quality.
  - repo: https://github.com/Yelp/detect-secrets
    rev: 01886c8a910c64595c47f186ca1ffc0b77fa5458 # frozen: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530 # frozen: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95 # frozen: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 341e2a331ba578029e66c2e01183e7a6b5ca9ab4 # frozen: v0.24.0
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: f6467e1f1ebecf5020560405c7b26e01786a43c8 # frozen: v10.4.0
    hooks:
      - id: cspell

  - repo: https://github.com/lycheeverse/lychee
    rev: 2bba271688c1abb1503097a064e6c3bc1d1b6a9b # frozen: lychee-v0.24.2
    hooks:
      - id: lychee-docker
        # Tag for readability; the digest makes the executed image immutable.
        entry: lycheeverse/lychee:0.24.2@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d
        types_or: [markdown]
        # Network and Docker: before push, not on every commit.
        stages: [pre-push]

  # GitHub Actions security and syntax; both ignore unrelated files.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7 # frozen: v1.32.0
    hooks:
      - id: zizmor
        # These paths trigger discovery; zizmor chooses the files in the scan.
        pass_filenames: false
        args: [--no-progress, .]
        files: |
          (?x)(^|/)(
            \.github/(workflows/[^/]+|dependabot|zizmor)\.ya?ml|
            action\.ya?ml|\.pre-commit-(config|hooks)\.ya?ml|zizmor\.ya?ml
          )$

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint
        # Exact Go toolchain; pre-commit bootstraps it when Go is not installed.
        language_version: 1.27.3
        pass_filenames: false
        files: ^(\.github/workflows/[^/]+\.ya?ml|\.pre-commit-config\.yaml)$
        # GitHub supports these source-bound references; actionlint 1.7.12 does not.
        # Governance checks exact owners and paths; remove exceptions when
        # upstream supports these references.
        args:
          - -ignore
          - 'reusable workflow call "\$/\.github/workflows/[a-z0-9-]+\.yml" at "uses" is not following the format'
          - -ignore
          - '^specifying action "\$/packages/delivery/actions/python-check" in invalid format because ref is missing\.'

  # Hooks reuse the bootstrapped environment (`--no-sync`) and never install;
  # only `dependency-licenses` syncs a changed lock, after `dependency-audit`.
  - repo: local
    hooks:
      # Supply chain
      - id: uv-lock
        name: uv.lock is current
        entry: uv lock --check
        language: unsupported
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
      - id: dependency-audit
        name: Locked dependency vulnerabilities, project statuses and wheel-only installs
        entry: uv run --no-project python scripts/audit_dependencies.py
        language: unsupported
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock|package\.json|bun\.lock)$
      - id: dependency-licenses
        name: Installed dependency licenses
        entry: uv run --locked python packages/shared/.apm/skills/kit-agent-runtime/assets/license_guard.py --allowlist license-allowlist.json
        language: unsupported
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock|license-allowlist\.json)$
      # Python quality and commit messages
      - id: ruff-check
        name: Ruff check (read-only; `task format` fixes)
        entry: uv run --locked --no-sync ruff check
        language: unsupported
        types_or: [python, pyi]
      - id: ruff-format-check
        name: Ruff format check (read-only; `task format` fixes)
        entry: uv run --locked --no-sync ruff format --check
        language: unsupported
        types_or: [python, pyi]
      - id: commitizen
        name: Conventional Commit message
        entry: uv run --locked --no-sync cz check --allow-abort --commit-msg-file
        language: unsupported
        stages: [commit-msg]
      # Repository-wide gates (pins, types, import contracts, toolkit contracts,
      # drift, docs) run once per push through the same parallel registry as
      # `task verify` and CI, keeping each commit to file-scoped checks.
      - id: toolkit-static
        name: Repository-wide static gates (scripts/verify.py static)
        entry: uv run --locked --no-sync python scripts/verify.py static
        language: unsupported
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # Duplication
      - id: jscpd
        name: jscpd copy-paste detection
        entry: bun run --bun jscpd
        language: unsupported
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  - repo: meta
    hooks:
      - id: check-useless-excludes
