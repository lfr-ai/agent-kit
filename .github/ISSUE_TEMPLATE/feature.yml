name: Feature proposal
description: Propose a focused capability with a concrete user outcome.
title: "Feature: "
labels: [enhancement]
body:
  - type: textarea
    id: outcome
    attributes:
      label: User outcome
      description: Describe the problem without private repository material.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Existing capabilities and alternatives
      description: Explain why an existing procedure or native feature is insufficient.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Acceptance and verification
      description: Include runtime, ownership, context cost, and compatibility implications.
