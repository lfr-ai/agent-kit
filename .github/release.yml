changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking changes
      labels: [breaking]
    - title: Capabilities
      labels: [skill, instruction, agent, enhancement]
    - title: Verification and delivery
      labels: [quality-gate, ci, release]
    - title: Fixes
      labels: [bug]
    - title: Documentation
      labels: [documentation]
    - title: Other changes
      labels: ["*"]
