# Generated release notes. Each pull request lands in the first matching category, so
# Dependencies precedes the categories that Dependabot's secondary labels would match.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking changes
      labels: [breaking]
    - title: Dependencies
      labels: [dependencies]
    - title: Capabilities
      labels: [skill, instruction, agent, enhancement]
    - title: Verification and delivery
      labels: [quality-gate, ci, release]
    - title: Fixes
      labels: [bug]
    - title: Documentation
      labels: [documentation]
    - title: Other changes
      labels: ["*"]
