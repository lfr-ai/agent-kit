name: Dependency audit

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    name: Locked dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APM_NO_SCRIPTS: "1"
      APM_NON_INTERACTIVE: "1"
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.3"
          enable-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"
      - name: Audit vulnerabilities, project statuses and wheel-only installs before syncing the locks
        run: uv run --no-project python scripts/audit_dependencies.py
      - name: Install the audited lock
        run: uv sync --locked
      - name: Check installed dependency licenses
        run: uv run --locked --no-sync python scripts/verify.py licenses
