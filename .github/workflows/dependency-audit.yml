name: Dependency audit

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    name: Locked dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APM_NO_SCRIPTS: "1"
      APM_NON_INTERACTIVE: "1"
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.3"
          enable-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"
      - name: Install only the hash-locked audit tools
        run: uv sync --locked --only-group audit
      - name: Audit vulnerabilities and wheel-only installs before syncing the locks
        run: uv run --locked --no-sync python scripts/audit_dependencies.py
      - name: Install the audited lock
        run: uv sync --locked
      - name: Check installed dependency licenses
        run: uv run --locked --no-sync python scripts/verify.py licenses
