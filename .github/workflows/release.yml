name: Reviewed draft release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: $/.github/workflows/ci.yml
    # The reusable verification includes the OIDC coverage upload job.
    permissions:
      contents: read
      id-token: write
    with:
      release-tag: ${{ github.ref_name }}

  publish:
    name: Draft artifacts after release approval
    needs: verify
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.3"
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: artifacts
      - name: Require approved ownership and reporting contacts
        run: uv run --locked python scripts/check_governance.py --publication
      - name: Verify downloaded checksums
        working-directory: artifacts
        run: sha256sum --check SHA256SUMS
      - name: Attest the verified workflow artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/*.whl
            artifacts/*.tar.gz
            artifacts/*.zip
      - name: Create draft only; operator reviews and publishes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/*.whl artifacts/*.tar.gz artifacts/*.zip artifacts/SHA256SUMS --verify-tag --draft --prerelease --generate-notes
