name: Delivery Bun CI

# Installs locked dependencies and runs the caller's check-only package.json script.
on:
  workflow_call:
    inputs:
      bun-version:
        description: Exact Bun version.
        type: string
        required: true
      script:
        description: package.json script to run (the project's check-only gate).
        type: string
        default: check
      working-directory:
        description: Directory containing package.json and bun.lock.
        type: string
        default: .
      runs-on:
        description: Linux runner label (Bash 4.4 or newer, as on every hosted Linux image).
        type: string
        default: ubuntu-24.04
      timeout-minutes:
        description: Job timeout.
        type: number
        default: 20

permissions:
  contents: read

jobs:
  gate:
    name: bun run ${{ inputs.script }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run script
        env:
          SCRIPT_NAME: ${{ inputs.script }}
        run: bun run "$SCRIPT_NAME"
