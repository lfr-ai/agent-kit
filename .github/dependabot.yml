# Give dependency PRs Conventional Commit prefixes so `cz check` accepts them.
version: 2

updates:
  # Python: pyproject.toml dependency groups and uv.lock, updated together.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Copenhagen
    open-pull-requests-limit: 5
    # Let new releases settle before proposing them; security updates are exempt.
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    labels: [dependencies]
    ignore:
      - dependency-name: hatchling
    groups:
      # Any security fix arrives as one PR, immediately.
      python-security:
        applies-to: security-updates
        patterns: ["*"]
      python-dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
        patterns: ["*"]
        # Review APM CLI updates separately with `task apm:smoke`; do not batch.
        exclude-patterns: [apm-cli]
      python-runtime:
        dependency-type: production
        update-types: [minor, patch]
        patterns: ["*"]

  # Keep Actions pinned to full SHAs with a version comment; the governance
  # check (scripts/checks/governance) rejects any mutable ref. The reusable
  # composite action pins its own setup steps, so it is scanned too.
  - package-ecosystem: github-actions
    directories: ["/", "/packages/delivery/actions/*"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Copenhagen
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
      include: scope
    labels: [dependencies, ci]
    groups:
      github-actions:
        patterns: ["*"]

  # Locked JavaScript tooling in package.json and bun.lock.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Copenhagen
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies]
    groups:
      javascript-security:
        applies-to: security-updates
        patterns: ["*"]
      javascript-tooling:
        patterns: ["*"]

  # Digest-pinned dev container base image in .devcontainer/Dockerfile.
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Copenhagen
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies]

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Copenhagen
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies]
    groups:
      devcontainer-features:
        patterns: ["*"]

  # Exact azapi provider pins in each delivery module's versions.tf.
  - package-ecosystem: terraform
    directories: ["/packages/delivery/infra/*/terraform"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Copenhagen
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies]
    groups:
      terraform-providers:
        patterns: ["*"]

  # pre-commit hook revisions in .pre-commit-config.yaml.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Copenhagen
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies, quality-gate]
    groups:
      pre-commit-hooks:
        patterns: ["*"]
