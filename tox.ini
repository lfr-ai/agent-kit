[tox]
min_version = 4.28
env_list =
    3.13
    3.14
    coverage
requires =
    tox==4.67.1
    tox-uv-bare==1.37.0

[testenv]
description = Run the full test suite on {base_python}
runner = uv-venv-lock-runner
dependency_groups = dev
uv_sync_flags = --link-mode=copy
pass_env =
    PYTHONIOENCODING
set_env =
    APM_NO_SCRIPTS = 1
    APM_NON_INTERACTIVE = 1
commands =
    pytest -n auto {posargs}

[testenv:unit]
description = Unit tier: tests/unit
base_python = 3.13
commands =
    pytest tests/unit -n auto {posargs}

[testenv:property]
description = Hypothesis property tier: tests/property
base_python = 3.13
commands =
    pytest tests/property {posargs}

[testenv:integration]
description = Process and filesystem integration tier: tests/integration
base_python = 3.13
commands =
    pytest tests/integration {posargs}

[testenv:coverage]
description = Full suite with branch coverage, enforced by .coveragerc fail_under
base_python = 3.13
commands =
    pytest -n auto --cov --cov-report=term-missing:skip-covered --cov-report=xml {posargs}
